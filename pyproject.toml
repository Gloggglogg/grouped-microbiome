[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grouped-microbiome"
version = "0.1.0"
description = "Array-based diversity and association methods for grouped observations"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.11", "statsmodels>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["grouped_microbiome*"]
